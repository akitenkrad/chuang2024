# 指標が何を測っているか (runvault の宣言．rs-runvault docs/metrics.ja.md)．
#
# 名前は `simulation/src/record.rs` と `simulation/src/main.rs` が書いているものと
# 一致していなければならない．`reproduce` は条件ラベルを接頭辞として
# `format!` で名前を作るため，bias × control の 6 条件と topology の 4 条件に
# 取りうる名前をすべて展開している．
#
# 意見平均・多様性・分極は模型の記述量であり，値の大小を成績としないため
# `direction = "none"` とする．

# --- 単一 run のステップ指標 ---------------------------------------------

[metrics."variance"]
meaning   = "5 段階意見値の母分散"
unit      = "opinion_squared"
direction = "none"
range     = [0.0, 4.0]
scope     = ["run"]

[metrics."bias"]
meaning   = "5 段階意見値の平均 B"
unit      = "opinion"
direction = "none"
range     = [-2.0, 2.0]
scope     = ["run"]

[metrics."diversity"]
meaning   = "5 段階意見値の標準偏差 D"
unit      = "opinion"
direction = "none"
range     = [0.0, 2.0]
scope     = ["run"]

[metrics."n_clusters"]
meaning   = "そのステップで占有されている相異なる意見水準の数"
unit      = "count"
direction = "none"
range     = [0.0, 5.0]
scope     = ["run"]

[metrics."polarization"]
meaning   = "意見の絶対値平均を意見空間の半径 2 で正規化した分極度"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

# --- 単一 run 全体と LLM の呼び出し --------------------------------------

[metrics."converged"]
meaning   = "意見分散が収束しきい値を下回って停止したなら 1，打ち切りなら 0"
unit      = "boolean"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."final_step"]
meaning   = "停止したときの最終ステップ番号"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."llm_calls"]
meaning   = "この run が行った LLM の呼び出し回数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."llm_cache_hits"]
meaning   = "LLM 呼び出しのうちキャッシュで応答した回数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."llm_cache_hit_rate"]
meaning   = "LLM 呼び出しのうちキャッシュで応答した割合"
unit      = "ratio"
direction = "up"
range     = [0.0, 1.0]
scope     = ["run"]

# --- sweep セルの試行平均 -------------------------------------------------

[metrics."n_converged"]
meaning   = "セル内で収束した試行の本数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."convergence_rate"]
meaning   = "セル内の試行群のうち収束したものの割合"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."mean_final_bias"]
meaning   = "セル内の試行群にわたる最終意見平均 B の平均"
unit      = "opinion"
direction = "none"
range     = [-2.0, 2.0]
scope     = ["run"]

[metrics."mean_final_diversity"]
meaning   = "セル内の試行群にわたる最終 Diversity D の平均"
unit      = "opinion"
direction = "none"
range     = [0.0, 2.0]
scope     = ["run"]

[metrics."mean_final_variance"]
meaning   = "セル内の試行群にわたる最終意見分散の平均"
unit      = "opinion_squared"
direction = "none"
range     = [0.0, 4.0]
scope     = ["run"]

[metrics."mean_n_clusters"]
meaning   = "セル内の試行群にわたる最終意見水準数の平均"
unit      = "count"
direction = "none"
range     = [0.0, 5.0]
scope     = ["run"]

[metrics."mean_polarization"]
meaning   = "セル内の試行群にわたる最終分極度の平均"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."mean_final_step"]
meaning   = "セル内の試行群にわたる停止ステップの平均"
unit      = "count"
direction = "none"
scope     = ["run"]

